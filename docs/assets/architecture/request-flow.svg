<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">각 단계의 성공 범위를 구분</title><desc id="desc">Kafka 접수 → DB 저장 → Redis 발행 → 화면 수신. 이력 조회를 완료한 기준 ID를 따로 관리합니다. 실시간 최대 ID만으로 복구 기준을 앞당기지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
<rect x="48" y="47" width="5" height="39" fill="#2563eb"/><text x="72" y="79" font-size="32" font-weight="700">각 단계의 성공 범위를 구분</text>
<rect x="48" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="213" font-size="27" font-weight="700">Kafka 접수</text><text x="72" y="254" font-size="19" fill="#475569">ACCEPTED</text><path d="M 286 228 H 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="364" y="213" font-size="27" font-weight="700">DB 저장</text><text x="364" y="254" font-size="19" fill="#475569">PERSISTED</text><path d="M 578 228 H 622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="656" y="213" font-size="27" font-weight="700">Redis 발행</text><text x="656" y="254" font-size="19" fill="#475569">commit 이후</text><path d="M 870 228 H 914" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="924" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="948" y="213" font-size="27" font-weight="700">화면 수신</text><text x="948" y="254" font-size="19" fill="#475569">실제 구독자</text>
<text x="48" y="363" font-size="21" fill="#334155">이력 조회를 완료한 기준 ID를 따로 관리합니다. 실시간 최대 ID만으로 복구 기준을 앞당기지 않습니다.</text>
</g></svg>
